buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Explicit versions so the root buildscript doesn't depend on a version
        // catalog (the Expo/RN catalog wiring doesn't reach it in this monorepo).
        // AGP pinned to RN 0.83's libs.versions.toml; Kotlin to the ext above.
        // react-native-gradle-plugin stays unversioned (composite includeBuild
        // in settings.gradle substitutes it).
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

apply plugin: "com.facebook.react.rootproject"
