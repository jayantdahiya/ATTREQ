apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Monorepo/workspace-aware: RN packages are hoisted to the repo-root node_modules.
// Resolve their locations via node so Gradle doesn't rely on fixed relative paths.
def resolveNodePackageDir(packageName) {
    return new File(
        ["node", "--print", "require.resolve('${packageName}/package.json')"]
            .execute(null, rootDir).text.trim()
    ).getParentFile()
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders — resolved for the hoisted monorepo layout */
    root = file("../../")
    reactNativeDir = resolveNodePackageDir("react-native")
    codegenDir = resolveNodePackageDir("@react-native/codegen")
    cliFile = new File(resolveNodePackageDir("react-native"), "cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //   The plugin's default lookup expects node_modules under apps/mobile;
    //   hermes-compiler is hoisted to the repo root, so resolve it explicitly
    //   (release bundling fails with "Couldn't determine Hermesc location" otherwise).
    hermesCommand = new File(resolveNodePackageDir("hermes-compiler"), "hermesc/%OS-BIN%/hermesc").absolutePath
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def releaseSigningVariables = [
    storeFile: System.getenv("ATTREQ_ANDROID_KEYSTORE_FILE"),
    storePassword: System.getenv("ATTREQ_ANDROID_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("ATTREQ_ANDROID_KEY_ALIAS"),
    keyPassword: System.getenv("ATTREQ_ANDROID_KEY_PASSWORD"),
]
def hasReleaseSigning = releaseSigningVariables.values().every { value ->
    value != null && !value.trim().isEmpty()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.attreq"
    defaultConfig {
        applicationId "com.attreq.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.2.0-beta.1"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigningVariables.storeFile)
                storePassword releaseSigningVariables.storePassword
                keyAlias releaseSigningVariables.keyAlias
                keyPassword releaseSigningVariables.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Never fall back to Android Debug. `verifyReleaseSigning` fails
            // release tasks early when the external credentials are absent.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

def releaseEnvFile = file("../../src/lib/utils/release-env.ts")

tasks.register("verifyReleaseSigning") {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                "Release signing is not configured. Export ATTREQ_ANDROID_KEYSTORE_FILE, " +
                "ATTREQ_ANDROID_KEYSTORE_PASSWORD, ATTREQ_ANDROID_KEY_ALIAS, and " +
                "ATTREQ_ANDROID_KEY_PASSWORD."
            )
        }
        if (!file(releaseSigningVariables.storeFile).isFile()) {
            throw new GradleException("ATTREQ Android release keystore does not exist.")
        }
    }
}

tasks.register("verifyReleaseApiUrl") {
    doLast {
        if (!releaseEnvFile.isFile()) {
            throw new GradleException("Missing src/lib/utils/release-env.ts")
        }
        def matcher = releaseEnvFile.text =~ /releaseApiBaseUrl\s*=\s*['\"]([^'\"]+)['\"]/
        if (!matcher.find()) {
            throw new GradleException("releaseApiBaseUrl is missing from release-env.ts")
        }
        def releaseUrl = new URI(matcher.group(1))
        def forbiddenHosts = ["localhost", "127.0.0.1", "10.0.2.2"]
        if (releaseUrl.scheme != "https" || releaseUrl.host == null || forbiddenHosts.contains(releaseUrl.host)) {
            throw new GradleException("Android release API URL must use HTTPS and a non-development hostname.")
        }
        if (releaseUrl.path != "/api/v1") {
            throw new GradleException("Android release API URL must end with /api/v1")
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn("verifyReleaseSigning", "verifyReleaseApiUrl")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
